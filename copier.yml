# Copier template: generates a YOURLS *site repo* managed by yourls-manager.

_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

# CI files live at their real paths under template/; the answers exclude the ones the
# site doesn't use, so `copier update --data ci_provider=...` removes the old ones.
_exclude:
  # Copier's defaults (setting _exclude replaces them)
  - copier.yaml
  - copier.yml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - "{% if ci_provider != 'github' %}.github{% endif %}"
  - "{% if ci_provider != 'gitlab' %}.gitlab-ci.yml{% endif %}"
  - "{% if ci_provider != 'github' or not release_artifact %}.github/workflows/publish.yml{% endif %}"

# Site-owned files: rendered once on `copier copy`, never touched by `copier update`.
# Everything else in template/ is template-owned and is 3-way merged on update.
_skip_if_exists:
  - site.toml
  - tests/redirects.toml
  - overlay/user/plugins/site-branding/assets/brand.css
  - overlay/user/plugins/site-branding/assets/README.md

# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
site_name:
  type: str
  help: Display name of the site (e.g. "Example Go Links")
  validator: >-
    {% if not site_name.strip() %}site_name must not be empty{% endif %}
    {% if '\n' in site_name or '*/' in site_name %}site_name must be a single line without "*/"{% endif %}

site_url:
  type: str
  help: >-
    Public base URL: https, lowercase, domain root, no trailing slash
    (e.g. https://go.example.com, or a single-label intranet host like https://goto).
    YOURLS must be installed at the domain root.
  placeholder: https://go.example.com
  validator: >-
    {% if not (site_url | regex_search('^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*(:[0-9]{1,5})?$')) %}site_url must look like https://go.example.com or https://goto (https, lowercase, no path, no trailing slash){% endif %}

site_slug:
  type: str
  help: >-
    Machine name [a-z0-9-]+. Names the server-local config file
    (yourls-config/<slug>.php) and the backup directory.
  default: "{{ site_url.split('://')[-1].split(':')[0] | replace('.', '-') | lower }}"
  validator: >-
    {% if not (site_slug | regex_search('^[a-z0-9-]+$')) %}site_slug must match [a-z0-9-]+{% endif %}

repo_url:
  type: str
  help: >-
    Web address of the site repo, e.g. https://github.com/you/go-links or
    https://gitlab.example.com/team/go-links (used in the README and its links only).
    Leave empty if it has none yet.
  default: ""
  validator: >-
    {% if repo_url and not (repo_url | regex_search('^https?://[^/\\s]+/[^\\s]+[^/\\s]$')) %}repo_url must be a web URL like https://github.com/you/go-links (no trailing slash){% endif %}

# ---------------------------------------------------------------------------
# Versions
# ---------------------------------------------------------------------------
yourls_version:
  type: str
  help: >-
    YOURLS core tag to start from (written to site.toml [core].version).
    "latest" is not allowed here; use `ym core latest` later.
  default: "1.10.6"
  validator: >-
    {% if not (yourls_version | regex_search('^[0-9]+\.[0-9]+(\.[0-9]+)?$')) %}yourls_version must be a release tag like 1.10.6{% endif %}

manager_version:
  type: str
  help: yourls-manager git tag to pin in pyproject.toml ([tool.uv.sources])
  default: v0.8.1
  validator: >-
    {% if not (manager_version | regex_search('^v[0-9]+\.[0-9]+\.[0-9]+$')) %}manager_version must be a tag like v0.1.0{% endif %}

# ---------------------------------------------------------------------------
# Deploy target "prod"
# ---------------------------------------------------------------------------
deploy_type:
  type: str
  help: >-
    How ym deploys to the server. rsync: rsync + PHP CLI over SSH (needs shell
    access; backs up the DB, runs DB upgrades and plugin activation). sftp: SFTP
    only, for hosts without shell access (no DB backup; you open the install /
    upgrade page and activate plugins in the browser, ym tells you when).
  choices:
    - rsync
    - sftp
  default: rsync

deploy_host:
  type: str
  help: >-
    SSH/SFTP host for the prod target (e.g. pdx1-shared-a1-01.dreamhost.com).
    Leave empty to configure later: the prod target is then written to
    site.toml commented out.
  default: ""
  validator: >-
    {% if deploy_host and not (deploy_host | regex_search('^[A-Za-z0-9.-]+$')) %}deploy_host must be a hostname{% endif %}

deploy_user:
  type: str
  help: SSH/SFTP user on the deploy host (the user that owns the web directory)
  # No default on purpose: Copier validates defaults, and an empty default would fail
  # the validator below as soon as deploy_host is set (crashing the prompt).
  when: "{{ deploy_host != '' }}"
  validator: >-
    {% if deploy_host and not (deploy_user | regex_search('^[A-Za-z0-9._-]+$')) %}deploy_user is required when deploy_host is set{% endif %}

deploy_port:
  type: int
  help: SSH/SFTP port
  default: 22
  when: "{{ deploy_host != '' }}"
  validator: >-
    {% if deploy_port < 1 or deploy_port > 65535 %}deploy_port must be 1-65535{% endif %}

deploy_path:
  type: str
  help: >-
    Web root on the server. Relative paths are relative to the remote $HOME
    (sftp: the SFTP login directory). DreamHost: the domain directory, e.g.
    go.example.com.
  default: "{{ site_url.split('://')[-1].split(':')[0] }}"
  validator: >-
    {% if not deploy_path.strip() or deploy_path.endswith('/') %}deploy_path must be non-empty with no trailing slash{% endif %}

php_binary:
  type: str
  help: >-
    PHP CLI binary on the server (>= 8.1). On DreamHost use the versioned
    binary, e.g. /usr/local/php83/bin/php, since plain `php` may be older.
  default: php
  # rsync targets only: sftp targets never run PHP on the server.
  when: "{{ deploy_type == 'rsync' }}"

# ---------------------------------------------------------------------------
# Content
# ---------------------------------------------------------------------------
include_example_plugins:
  type: bool
  help: >-
    Add a few well-known plugins to site.toml (YOURLS/timezones and
    YOURLS/404-if-not-found active; others as commented examples)?
  default: true

# ---------------------------------------------------------------------------
# CI and releases
# ---------------------------------------------------------------------------
ci_provider:
  type: str
  help: >-
    Where the site's CI runs: github (GitHub Actions workflows in .github/), gitlab
    (.gitlab-ci.yml) or none (no CI files; deploy and update from your machine).
    CI deploys release tags (only targets with `ci = true`), opens weekly update
    pull/merge requests and, with release_artifact, publishes release archives.
    Switch later with `ym template update --data ci_provider=...`.
  choices:
    - github
    - gitlab
    - none
  default: github

ci_deploy:
  type: bool
  help: >-
    Deploy prod from CI when a release tag is pushed? Writes `ci = true` on the prod
    target. GitHub: after pushing the repo, `ym ci setup prod` stores the deploy key and
    host keys. GitLab: set the environment's CI/CD variables by hand (see the site
    README). No: deploy from your machine with `ym deploy prod`.
  default: false
  when: "{{ ci_provider != 'none' }}"

gitlab_image:
  type: str
  help: >-
    Container image for the GitLab CI jobs: needs uv, Python >= 3.11 and git, and
    apt-get (the jobs install rsync and openssh-client). Written as the default of the
    CI/CD variable YM_CI_IMAGE; a project variable of that name overrides it.
  default: ghcr.io/astral-sh/uv:python3.13-bookworm
  when: "{{ ci_provider == 'gitlab' }}"
  validator: >-
    {% if not (gitlab_image | regex_search('^[A-Za-z0-9][A-Za-z0-9._/:@-]*$')) %}gitlab_image must be an image reference like ghcr.io/astral-sh/uv:python3.13-bookworm{% endif %}

gitlab_runner_tag:
  type: str
  help: >-
    Runner tag the GitLab CI jobs require (e.g. docker). Leave empty to run on any
    available runner, such as GitLab.com's instance runners. Written as the default of
    the CI/CD variable YM_RUNNER_TAG; a project variable of that name overrides it.
  default: ""
  when: "{{ ci_provider == 'gitlab' }}"
  validator: >-
    {% if gitlab_runner_tag and not (gitlab_runner_tag | regex_search('^[A-Za-z0-9][A-Za-z0-9._:/-]*$')) %}gitlab_runner_tag must be a single tag (letters, digits, . _ : / -){% endif %}

release_artifact:
  type: bool
  help: >-
    Publish every release tag as a reproducible archive of the built site
    (`ym artifact build`: .tar.gz + .sha256 + .json metadata), for sites that another
    system packages and deploys? Writes `[artifact] enabled = true` to site.toml and adds
    a publish job to CI (GitHub releases, or GitLab's package registry + releases).
  default: false

_message_after_copy: |
  Site repo for {{ site_name }} created in {{ _copier_conf.dst_path }}.

  Next steps (in {{ _copier_conf.dst_path }}):
  {%- if not deploy_host %}
    ym target add prod           # first: where and how the site deploys
  {%- endif %}
    ym target config prod        # write the server-local config (secrets stay on the server)
    ym deploy prod --dry-run     # build and show what a deploy would change
  {%- if ci_provider == 'github' %}
    ym repo create               # optional: keep the site on GitHub (private)
  {%-   if ci_deploy %}
    ym ci setup prod             # GitHub Actions deploys: deploy key + host keys
  {%-   endif %}
  {%- elif ci_provider == 'gitlab' %}
  GitLab CI: push the repo to GitLab, then set up its environments and variables as
  described under "GitLab CI" in README.md.
  {%- endif %}
  {%- if release_artifact %}
  Release artifacts: `ym release --push` tags a release and CI publishes its archives
  ({% if ci_provider == 'none' %}no CI: publish the output of `ym artifact build` yourself{% else %}see "Release artifacts" in README.md{% endif %}).
  {%- endif %}

  If you ran copier directly (not via `ym new` / `ym init`), first run `ym core` and
  `ym plugin sync` to vendor YOURLS and plugins, then `git init -b main` and commit.
  Adopting an existing install? Run `ym adopt --from-target prod` before `ym target config`.

  Full instructions: https://github.com/RubenFixit/yourls-manager#readme
